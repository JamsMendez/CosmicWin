<!DOCTYPE html>
<!--
  html-wallpaper-demo D2: the processing scene as the wallpaper page itself, with the alert overlay
  drawn into the SAME canvas/loop (see ../shared/js/alert-overlay.js's header remarks) -- adapted from
  docs/great-sage/backgroud-processing/index.html (reference-only, excluded from git; see the feature
  doc, "Source material"). Loaded directly by WebViewAlertLayerController.cs (D3) through a virtual
  host folder mapping (D6a: the mapping now covers the whole Wallpaper/Web folder, not just this

      index.html#tiles=failed,warning&columns=2&rows=1&gap=8&duration=5000

-->
