<!doctype html>
<!--
  html-wallpaper-demo D6b: the raphael scene as a wallpaper page, with the alert overlay drawn into
  the SAME canvas/loop (see ../shared/js/alert-overlay.js's header remarks) -- adapted from
  docs/great-sage/background-raphael/index.html (reference-only, excluded from git; see the feature
  doc, "Source material"), the same technique CosmicWin.App/Wallpaper/Web/processing/index.html (D2)
  and .../explorer/index.html (D6a) already use. Loaded by WebViewAlertLayerController.cs through the
  shared Wallpaper/Web virtual host folder mapping once this scene is selected (D6d).

  Driven by the same hash/postMessage alert API as every other scene page, e.g.:
      index.html#tiles=failed,warning&columns=2&rows=1&gap=8&duration=5000
      index.html#kind=failed&duration=5000
  Starts idle (scene only) when no hash param is present -- see ../shared/js/alert-overlay.js.

  Dropped from the reference page (per "Drop what a wallpaper does not need", D2/D6a precedent): the
  Google Fonts preconnect/stylesheet <link>s for Archivo Black (styles.css now declares an offline
  @font-face against ../shared/fonts/ArchivoBlack-Regular.ttf instead, same as processing's/explorer's
  own styles.css), js/failure-overlay.js (the shared overlay replaces it) and js/invariants.js
  (inspects render()'s own source text and the single-overlay failureState, neither of which survives
  the shared, tile-driven overlay -- see the feature doc).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Raphael background — animated recreation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="nebula" aria-hidden="true" tabindex="-1"></canvas>
  <canvas id="scene" aria-label="Raphael background"></canvas>
  <script src="js/config.js"></script>
  <script src="js/math.js"></script>
  <script src="js/hexadecagon.js"></script>
  <script src="js/nebula.js"></script>
  <script src="js/sphere.js"></script>
  <script src="js/scene-data.js"></script>
  <script src="js/feathers.js"></script>
  <script src="js/glyphs.js"></script>
  <script src="js/glyph-rings.js"></script>
  <script src="js/digits.js"></script>
  <script src="js/central-core.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/see-through-hook.js"></script>
  <script src="../shared/js/alert-overlay.js"></script>
  <script src="../shared/js/render-loop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
